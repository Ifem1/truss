name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run preflight
      - run: npm run cli:version
      - run: npm run contracts:check
      - run: npm run test:unit
      - run: npm run test:direct
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_TRUSS_CONTRACT_ADDRESS: "0x1111111111111111111111111111111111111111"
          NEXT_PUBLIC_ACTIVATION_GATE_ADDRESS: "0x3333333333333333333333333333333333333333"
      - run: npm run test:e2e

  attest-source:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create exact source archive
        run: git archive --format=tar --prefix="truss-${GITHUB_SHA}/" "${GITHUB_SHA}" | gzip -n > "$RUNNER_TEMP/truss-source.tar.gz"
      - name: Attest tested source archive
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/truss-source.tar.gz
      - name: Retain source archive and verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: truss-source-attestation-${{ github.sha }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            ${{ runner.temp }}/truss-source.tar.gz
          if-no-files-found: error
          retention-days: 90
